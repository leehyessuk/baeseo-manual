<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배서 매뉴얼 - 전산경로</title>
<style>
  :root {
    --primary: #3B5BDB;
    --primary-light: #EDF2FF;
    --primary-dark: #1C3FAA;
    --accent: #FF6B6B;
    --surface: #FFFFFF;
    --bg: #F0F4FF;
    --border: #DEE2E6;
    --text: #212529;
    --text-muted: #6C757D;
    --success: #37B24D;
    --warning: #F59F00;
    --tag-bg: #E3F9E5;
    --tag-text: #2B8A3E;
    --category-bg: #FFF9DB;
    --category-text: #E67700;
    --shadow: 0 2px 8px rgba(59,91,219,0.10);
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Header */
  .header {
    background: linear-gradient(135deg, #3B5BDB 0%, #1C3FAA 100%);
    color: white; padding: 0;
    box-shadow: 0 4px 16px rgba(59,91,219,0.25);
    position: sticky; top: 0; z-index: 100;
  }
  .header-top { display: flex; align-items: center; gap: 12px; padding: 14px 20px 10px; }
  .header-title { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
  .header-sub { font-size: 0.82rem; opacity: 0.8; margin-left: auto; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .btn { border: none; cursor: pointer; border-radius: 8px; font-family: inherit; font-weight: 600; transition: all 0.15s; }
  .btn-sm { padding: 6px 14px; font-size: 0.82rem; }
  .btn-primary { background: white; color: var(--primary); }
  .btn-primary:hover { background: #EDF2FF; }
  .btn-success { background: var(--success); color: white; }
  .btn-success:hover { background: #2F9E44; }
  .btn-danger { background: var(--accent); color: white; }
  .btn-danger:hover { background: #FA5252; }
  .btn-outline { background: transparent; color: white; border: 1.5px solid rgba(255,255,255,0.5); }
  .btn-outline:hover { background: rgba(255,255,255,0.15); }

  /* Search */
  .search-bar { padding: 0 20px 12px; display: flex; gap: 10px; align-items: center; }
  .search-wrap { position: relative; flex: 1; max-width: 600px; }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 1rem; }
  .search-input {
    width: 100%; padding: 10px 16px 10px 36px;
    border: none; border-radius: 8px; font-size: 0.95rem;
    background: rgba(255,255,255,0.15); color: white;
    outline: none; font-family: inherit;
    transition: background 0.2s;
  }
  .search-input::placeholder { color: rgba(255,255,255,0.6); }
  .search-input:focus { background: rgba(255,255,255,0.25); }
  .search-count { font-size: 0.8rem; opacity: 0.8; white-space: nowrap; }

  /* Tabs */
  .tabs-wrap { background: white; border-bottom: 2px solid var(--border); position: sticky; top: 116px; z-index: 90; overflow: hidden; }
  .tabs { display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 8px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; padding: 10px 18px; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; border-bottom: 3px solid transparent; color: var(--text-muted);
    transition: all 0.15s; white-space: nowrap; font-family: inherit;
    background: none; border-top: none; border-left: none; border-right: none;
  }
  .tab:hover { color: var(--primary); background: var(--primary-light); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab .count { font-size: 0.72rem; background: var(--primary-light); color: var(--primary); padding: 1px 6px; border-radius: 10px; margin-left: 4px; }
  .tab.active .count { background: var(--primary); color: white; }

  /* Main */
  .main { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }

  /* Info banner */
  .info-banner {
    background: white; border-radius: var(--radius); border-left: 4px solid var(--primary);
    padding: 12px 16px; margin-bottom: 16px; font-size: 0.82rem; color: var(--text-muted);
    box-shadow: var(--shadow); line-height: 1.6; cursor: pointer;
  }
  .info-banner summary { font-weight: 700; color: var(--primary); cursor: pointer; }

  /* Entries */
  .entries { display: flex; flex-direction: column; gap: 10px; }
  .entry-card {
    background: white; border-radius: var(--radius); padding: 0;
    box-shadow: var(--shadow); border: 1px solid var(--border);
    transition: box-shadow 0.15s; overflow: hidden;
  }
  .entry-card:hover { box-shadow: 0 4px 16px rgba(59,91,219,0.15); }
  .entry-card.highlight { border-color: var(--primary); }
  .entry-header { padding: 12px 16px 8px; display: flex; align-items: flex-start; gap: 10px; }
  .entry-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .badge {
    font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 20px;
  }
  .badge-cat { background: var(--category-bg); color: var(--category-text); }
  .badge-sub { background: var(--primary-light); color: var(--primary); }
  .badge-ins { background: #F3F0FF; color: #6741D9; }
  .entry-path {
    background: var(--bg); border-radius: 6px; padding: 10px 14px; margin: 0 16px 0;
    font-size: 0.88rem; line-height: 1.7; color: var(--text);
    white-space: pre-wrap; word-break: break-all;
  }
  .entry-path .arrow { color: var(--primary); font-weight: 700; }
  .entry-note {
    margin: 8px 16px 12px; font-size: 0.8rem; color: var(--text-muted);
    background: #FFFBF0; border-left: 3px solid var(--warning);
    padding: 8px 12px; border-radius: 0 6px 6px 0; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all;
  }
  .entry-actions { display: flex; gap: 6px; margin: 0 16px 12px; }
  .entry-actions .btn { padding: 4px 12px; font-size: 0.78rem; }
  .btn-edit { background: var(--primary-light); color: var(--primary); }
  .btn-del { background: #FFF5F5; color: var(--accent); }

  /* Edit modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 1000; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white; border-radius: 14px; padding: 24px; max-width: 600px; width: 100%;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; color: var(--primary); }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; display: block; }
  .form-control {
    width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 0.9rem; font-family: inherit; outline: none; transition: border-color 0.15s;
    color: var(--text);
  }
  .form-control:focus { border-color: var(--primary); }
  textarea.form-control { min-height: 80px; resize: vertical; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .modal-btns .btn { padding: 8px 20px; }

  /* Add form */
  .add-section {
    background: white; border-radius: var(--radius); padding: 16px;
    box-shadow: var(--shadow); margin-bottom: 16px; border: 2px dashed var(--primary);
    display: none;
  }
  .add-section.open { display: block; }
  .add-title { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Google Drive */
  .gdrive-bar {
    background: #E8F5E9; border-radius: 8px; padding: 10px 16px;
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    font-size: 0.85rem; flex-wrap: wrap;
  }
  .gdrive-status { display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
  .status-dot.connected { background: var(--success); }
  .status-dot.syncing { background: var(--warning); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Empty */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-icon { font-size: 3rem; margin-bottom: 12px; }

  /* Highlight */
  mark { background: #FFD43B; padding: 0 2px; border-radius: 2px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 20px; right: 20px; background: #333; color: white;
    padding: 12px 20px; border-radius: 10px; font-size: 0.88rem; z-index: 9999;
    transform: translateY(100px); transition: transform 0.3s; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .toast.show { transform: translateY(0); }

  @media (max-width: 600px) {
    .form-row { grid-template-columns: 1fr; }
    .header-sub { display: none; }
    .entry-header { flex-wrap: wrap; }
    .search-bar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <span style="font-size:1.5rem">📋</span>
    <span class="header-title">배서 매뉴얼 전산경로</span>
    <span class="header-sub">보험사별 배서 업무 가이드</span>
    <div class="header-actions" style="margin-left:auto">
      <button class="btn btn-sm btn-outline" onclick="toggleAdd()">✚ 항목 추가</button>
      <button class="btn btn-sm btn-primary" onclick="exportData()">📥 내보내기</button>
      <button class="btn btn-sm btn-outline" onclick="document.getElementById('importFile').click()">📤 불러오기</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
  <div class="search-bar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="키워드로 검색 (예: 계좌변경, 주민번호, 부활...)" oninput="doSearch()">
    </div>
    <span class="search-count" id="searchCount"></span>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs"></div>
</div>

<div class="main">
  <!-- Google Drive sync -->
  <div class="gdrive-bar" id="gdriveBar">
    <span style="font-size:1.2rem">🔵</span>
    <div class="gdrive-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText" style="font-weight:600">Google Drive 미연결</span>
    </div>
    <span style="color:#555;font-size:0.8rem">다른 기기에서도 사용하려면 Google Drive에 저장하세요</span>
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm" style="background:#4285F4;color:white" onclick="connectGDrive()">🔗 Google 로그인</button>
      <button class="btn btn-sm" style="background:#34A853;color:white" onclick="saveToGDrive()">☁️ Google Drive 저장</button>
      <button class="btn btn-sm" style="background:#EA4335;color:white" onclick="loadFromGDrive()">📥 Google Drive 불러오기</button>
    </div>
  </div>

  <!-- Add form -->
  <div class="add-section" id="addSection">
    <div class="add-title">✚ 새 항목 추가</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">보험사</label>
        <select class="form-control" id="addInsurer"></select>
      </div>
      <div class="form-group">
        <label class="form-label">배서 유형 (카테고리)</label>
        <input class="form-control" id="addCategory" placeholder="예: 계약자 변경">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">세부 구분</label>
      <input class="form-control" id="addSubcat" placeholder="예: 일반변경 (없으면 비워두세요)">
    </div>
    <div class="form-group">
      <label class="form-label">전산 경로 *</label>
      <textarea class="form-control" id="addPath" rows="3" placeholder="장기상세조회 > 하단 계약변경 클릭 > ..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">비고/주의사항</label>
      <textarea class="form-control" id="addNote" rows="2" placeholder="참고사항이 있으면 입력하세요"></textarea>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-success btn-sm" onclick="addEntry()">저장</button>
      <button class="btn btn-sm" style="background:#f1f3f5;color:#333" onclick="toggleAdd()">취소</button>
    </div>
  </div>

  <div class="entries" id="entriesContainer"></div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-title">✏️ 항목 수정</div>
    <input type="hidden" id="editId">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">보험사</label>
        <select class="form-control" id="editInsurer"></select>
      </div>
      <div class="form-group">
        <label class="form-label">배서 유형</label>
        <input class="form-control" id="editCategory">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">세부 구분</label>
      <input class="form-control" id="editSubcat">
    </div>
    <div class="form-group">
      <label class="form-label">전산 경로</label>
      <textarea class="form-control" id="editPath" rows="4"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">비고/주의사항</label>
      <textarea class="form-control" id="editNote" rows="3"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-sm" style="background:#f1f3f5;color:#333" onclick="closeModal()">취소</button>
      <button class="btn btn-success btn-sm" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<!-- Toast -->

// ── Init ───────────────────────────────────────────────────────────────────
function init() {
  // Load from localStorage or use raw data
  const saved = localStorage.getItem('baeseo_data_v3');
  if (saved) {
    try { appData = JSON.parse(saved); } catch(e) { appData = buildFromRaw(); }
  } else {
    appData = buildFromRaw();
  }
  buildTabs();
  populateInsurerSelects();
  render();
}

function buildFromRaw() {
  const d = {};
  let uid = 1;
  for (const [key, val] of Object.entries(RAW_DATA)) {
    d[key] = {
      title: val.title,
      note: val.note,
      entries: val.entries.map(e => ({ ...e, id: uid++ }))
    };
  }
  return d;
}

function saveLocal() {
  localStorage.setItem('baeseo_data_v3', JSON.stringify(appData));
}

function getAllEntries() {
  const all = [];
  for (const key of INSURERS) {
    if (appData[key]) {
      for (const e of appData[key].entries) {
        all.push({ ...e, insurer: key });
      }
    }
  }
  return all;
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function buildTabs() {
  const tabs = document.getElementById('tabs');
  const allCount = getAllEntries().length;
  tabs.innerHTML = `<button class="tab ${currentTab==='ALL'?'active':''}" onclick="setTab('ALL')">전체 <span class="count">${allCount}</span></button>`;
  for (const key of INSURERS) {
    if (!appData[key]) continue;
    const cnt = appData[key].entries.length;
    tabs.innerHTML += `<button class="tab ${currentTab===key?'active':''}" onclick="setTab('${key}')">${key} <span class="count">${cnt}</span></button>`;
  }
}

function setTab(key) {
  currentTab = key;
  buildTabs();
  render();
}

// ── Search ─────────────────────────────────────────────────────────────────
function doSearch() {
  searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
  render();
}

function highlight(text, query) {
  if (!query || !text) return escHtml(text || '');
  const esc = query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return escHtml(text).replace(new RegExp(esc, 'gi'), m => `<mark>${m}</mark>`);
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

  if (searchQuery) {
    entries = entries.filter(e =>
      (e.category||'').toLowerCase().includes(searchQuery) ||
      (e.subcategory||'').toLowerCase().includes(searchQuery) ||
      (e.path||'').toLowerCase().includes(searchQuery) ||
      (e.note||'').toLowerCase().includes(searchQuery) ||
      (e.insurer||'').toLowerCase().includes(searchQuery)
    );
  }

  const sc = document.getElementById('searchCount');
  if (searchQuery) {
    sc.textContent = `${entries.length}건 검색됨`;
  } else {
    sc.textContent = `총 ${entries.length}건`;
  }

  const container = document.getElementById('entriesContainer');

  if (entries.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div>검색 결과가 없습니다</div><div style="font-size:0.8rem;margin-top:6px">다른 키워드로 검색해보세요</div></div>`;
    return;
  }

  // Show info banner for current tab
  let bannerHtml = '';
  if (currentTab !== 'ALL' && appData[currentTab]?.note) {
    bannerHtml = `<details class="info-banner"><summary>★ ${currentTab} 배서 안내 (클릭하여 보기/접기)</summary><div style="margin-top:8px;white-space:pre-wrap">${escHtml(appData[currentTab].note)}</div></details>`;
  }

  let html = bannerHtml;
  let lastCat = '';
  let lastIns = '';

  for (const e of entries) {
    const ins = e.insurer || '';
    const cat = e.category || '';
    const sub = e.subcategory || '';
    const path = e.path || '';
    const note = e.note || '';
    const insColor = INSURER_COLORS[ins] || '#555';
    const insBg = INSURER_BG[ins] || '#f5f5f5';

    // Format path with colored arrows
    const formattedPath = highlight(path, searchQuery)
      .replace(/&gt;/g, '<span class="arrow"> ▶ </span>')
      .replace(/→/g, '<span class="arrow"> → </span>');

    html += `<div class="entry-card">
      <div class="entry-header">
        <div style="flex:1">
          <div class="entry-badges">
            ${currentTab==='ALL' ? `<span class="badge" style="background:${insBg};color:${insColor}">${ins}</span>` : ''}
            ${cat ? `<span class="badge badge-cat">${highlight(cat, searchQuery)}</span>` : ''}
            ${sub ? `<span class="badge badge-sub">${highlight(sub, searchQuery)}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="btn btn-sm btn-edit" onclick="openEdit(${e.id},'${ins}')">✏️ 수정</button>
          <button class="btn btn-sm btn-del" onclick="deleteEntry(${e.id},'${ins}')">🗑️ 삭제</button>
        </div>
      </div>
      <div class="entry-path">${formattedPath}</div>
      ${note ? `<div class="entry-note">📌 ${highlight(note, searchQuery)}</div>` : ''}
    </div>`;
  }

  container.innerHTML = html;
}

// ── Add ────────────────────────────────────────────────────────────────────
function toggleAdd() {
  const s = document.getElementById('addSection');
  s.classList.toggle('open');
}

function addEntry() {
  const insurer = document.getElementById('addInsurer').value;
  const cat = document.getElementById('addCategory').value.trim();
  const sub = document.getElementById('addSubcat').value.trim();
  const path = document.getElementById('addPath').value.trim();
  const note = document.getElementById('addNote').value.trim();

  if (!path) { showToast('전산 경로를 입력하세요'); return; }
  if (!appData[insurer]) {
    appData[insurer] = { title: insurer + ' 배서', note: '', entries: [] };
  }

  const id = Date.now();
  appData[insurer].entries.push({ id, category: cat, subcategory: sub, path, note });
  saveLocal();
  buildTabs();
  render();
  document.getElementById('addPath').value = '';
  document.getElementById('addCategory').value = '';
  document.getElementById('addSubcat').value = '';
  document.getElementById('addNote').value = '';
  document.getElementById('addSection').classList.remove('open');
  showToast('✅ 항목이 추가되었습니다');
}

// ── Edit ───────────────────────────────────────────────────────────────────
function openEdit(id, insurer) {
  const entries = appData[insurer]?.entries || [];
  const e = entries.find(x => x.id === id);
  if (!e) return;
  document.getElementById('editId').value = id + '|' + insurer;
  document.getElementById('editInsurer').value = insurer;
  document.getElementById('editCategory').value = e.category || '';
  document.getElementById('editSubcat').value = e.subcategory || '';
  document.getElementById('editPath').value = e.path || '';
  document.getElementById('editNote').value = e.note || '';
  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
}

function saveEdit() {
  const [idStr, insurer] = document.getElementById('editId').value.split('|');
  const id = parseInt(idStr);
  const newInsurer = document.getElementById('editInsurer').value;

  // Remove from old insurer
  if (appData[insurer]) {
    const idx = appData[insurer].entries.findIndex(x => x.id === id);
    if (idx !== -1) {
      const updated = {
        id,
        category: document.getElementById('editCategory').value.trim(),
        subcategory: document.getElementById('editSubcat').value.trim(),
        path: document.getElementById('editPath').value.trim(),
        note: document.getElementById('editNote').value.trim()
      };
      if (newInsurer !== insurer) {
        appData[insurer].entries.splice(idx, 1);
        if (!appData[newInsurer]) appData[newInsurer] = { title: newInsurer + ' 배서', note: '', entries: [] };
        appData[newInsurer].entries.push(updated);
      } else {
        appData[insurer].entries[idx] = updated;
      }
    }
  }
  saveLocal();
  buildTabs();
  render();
  closeModal();
  showToast('✅ 수정되었습니다');
}

// ── Delete ─────────────────────────────────────────────────────────────────
function deleteEntry(id, insurer) {
  if (!confirm('이 항목을 삭제하시겠습니까?')) return;
  if (appData[insurer]) {
    appData[insurer].entries = appData[insurer].entries.filter(x => x.id !== id);
  }
  saveLocal();
  buildTabs();
  render();
  showToast('🗑️ 삭제되었습니다');
}

// ── Export / Import ────────────────────────────────────────────────────────
function exportData() {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '배서매뉴얼_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  showToast('📥 파일을 다운로드합니다');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (confirm('현재 데이터를 불러온 파일로 교체하시겠습니까?')) {
        appData = imported;
        saveLocal();
        buildTabs();
        render();
        showToast('✅ 데이터를 불러왔습니다');
      }
    } catch(err) { showToast('❌ 파일 형식이 올바르지 않습니다'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ── Google Drive ────────────────────────────────────────────────────────────
const CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID'; // 사용자가 설정해야 함
const FILE_NAME = '배서매뉴얼_sync.json';
const MIME = 'application/json';

function connectGDrive() {
  // Load Google API
  if (!window.gapi) {
    const script = document.createElement('script');
    script.src = 'https://apis.google.com/js/api.js';
    script.onload = () => {
      gapi.load('auth2', () => {
        gapi.auth2.init({ client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file' }).then(auth => {
          auth.signIn().then(user => {
            gToken = user.getAuthResponse().access_token;
            document.getElementById('statusDot').className = 'status-dot connected';
            document.getElementById('statusText').textContent = '연결됨: ' + user.getBasicProfile().getEmail();
            showToast('✅ Google 계정이 연결되었습니다');
          }).catch(() => showToast('❌ 로그인이 취소되었습니다'));
        });
      });
    };
    document.head.appendChild(script);
  } else {
    showToast('이미 연결되어있거나 API 로딩중입니다');
  }
  
  // Alternative: OAuth token input
  const token = prompt('Google Drive API 토큰을 직접 입력하거나 취소하세요:\n(Google Drive 연동을 위한 개발자 설정이 필요합니다)\n\n대신 JSON 파일로 내보내기/불러오기 기능을 사용하시면\n다른 기기에서도 파일을 공유할 수 있습니다.');
  if (token) {
    gToken = token;
    document.getElementById('statusDot').className = 'status-dot connected';
    document.getElementById('statusText').textContent = '토큰 연결됨';
    showToast('✅ 토큰이 등록되었습니다');
  }
}

async function saveToGDrive() {
  if (!gToken) {
    // Fallback: download file + instructions
    showToast('💡 Google Drive 저장: 먼저 로그인하거나, 내보내기 후 Google Drive에 직접 업로드하세요');
    exportData();
    return;
  }
  
  document.getElementById('statusDot').className = 'status-dot syncing';
  document.getElementById('statusText').textContent = '저장 중...';
  
  const content = JSON.stringify(appData, null, 2);
  
  try {
    // Search for existing file
    const searchRes = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=name='${FILE_NAME}' and trashed=false&fields=files(id,name)`,
      { headers: { Authorization: 'Bearer ' + gToken } }
    );
    const searchData = await searchRes.json();
    
    if (searchData.files && searchData.files.length > 0) {
      gFileId = searchData.files[0].id;
      // Update existing
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${gFileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { Authorization: 'Bearer ' + gToken, 'Content-Type': MIME },
        body: content
      });
    } else {
      // Create new
      const meta = await fetch('https://www.googleapis.com/drive/v3/files', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + gToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: FILE_NAME, mimeType: MIME })
      });
      const metaData = await meta.json();
      gFileId = metaData.id;
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${gFileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { Authorization: 'Bearer ' + gToken, 'Content-Type': MIME },
        body: content
      });
    }
    
    document.getElementById('statusDot').className = 'status-dot connected';
    document.getElementById('statusText').textContent = `Google Drive 저장 완료 (${new Date().toLocaleTimeString()})`;
    showToast('☁️ Google Drive에 저장되었습니다');
  } catch(err) {
    document.getElementById('statusDot').className = 'status-dot';
    showToast('❌ 저장 실패: ' + err.message);
  }
}

async function loadFromGDrive() {
  if (!gToken) {
    showToast('💡 먼저 Google 로그인을 해주세요\n또는 JSON 파일 불러오기 기능을 사용하세요');
    return;
  }
  
  document.getElementById('statusDot').className = 'status-dot syncing';
  document.getElementById('statusText').textContent = '불러오는 중...';
  
  try {
    const searchRes = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=name='${FILE_NAME}' and trashed=false&fields=files(id,name)`,
      { headers: { Authorization: 'Bearer ' + gToken } }
    );
    const searchData = await searchRes.json();
    
    if (!searchData.files || searchData.files.length === 0) {
      showToast('❌ Google Drive에 저장된 파일이 없습니다');
      return;
    }
    
    gFileId = searchData.files[0].id;
    const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${gFileId}?alt=media`, {
      headers: { Authorization: 'Bearer ' + gToken }
    });
    const data = await fileRes.json();
    
    if (confirm('Google Drive의 데이터로 현재 데이터를 교체하시겠습니까?')) {
      appData = data;
      saveLocal();
      buildTabs();
      render();
      document.getElementById('statusDot').className = 'status-dot connected';
      document.getElementById('statusText').textContent = `Google Drive 불러오기 완료`;
      showToast('☁️ Google Drive에서 불러왔습니다');
    }
  } catch(err) {
    document.getElementById('statusDot').className = 'status-dot';
    showToast('❌ 불러오기 실패: ' + err.message);
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function populateInsurerSelects() {
  for (const id of ['addInsurer', 'editInsurer']) {
    const sel = document.getElementById(id);
    sel.innerHTML = INSURERS.map(k => `<option value="${k}">${k}</option>`).join('');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Close modal on overlay click
document.getElementById('editModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Init
init();
</script>
